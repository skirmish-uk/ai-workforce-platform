name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # test scripts pass globs to node --test, which needs Node 21+
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        working-directory: ./packages/db

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      # pgvector image: the schema needs the `vector` extension (packages/knowledge).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_workforce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      # DB-backed tests refuse to run unless the database name ends in _test.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_workforce_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_workforce_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # test scripts pass globs to node --test, which needs Node 21+
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        working-directory: ./packages/db

      # Development uses `prisma db push` (the migrations folder only holds the initial migration).
      - name: Create schema
        run: npx prisma db push --skip-generate
        working-directory: ./packages/db

      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    services:
      # @ai-workforce/queue opens a Redis connection when imported during `next build`.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unused?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # test scripts pass globs to node --test, which needs Node 21+
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        working-directory: ./packages/db

      - name: Build all packages
        run: npm run build

  # No Docker image job: the repo has no Dockerfile yet. Add one with the staging deployment (launch plan, week of 26 Oct).
